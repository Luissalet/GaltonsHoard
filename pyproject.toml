[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galton-hoard"
version = "0.1.0"
description = "A local test bench for language and vision models: it measures the models on this computer with checkable tasks, compares them with statistics and publishes which model to use for each task."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Luissalet" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "mcp>=1.10,<2",
  "pillow>=10.3",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
math = ["sympy>=1.13"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
galton-hoard = "galton_hoard.__main__:main"

[tool.setuptools.packages.find]
include = ["galton_hoard*"]

[tool.setuptools.package-data]
galton_hoard = ["static/**/*", "suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
